html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--ink);min-height:100vh;line-height:1.45;-webkit-text-size-adjust:100%}

.container{max-width:850px;margin:auto;padding:20px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card h2{margin-bottom:6px;font-size:1.15rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;margin-bottom:16px}
.grid .card{margin:0}
.subject{cursor:pointer;transition:transform .2s,background .2s;text-align:left;width:100%;color:inherit;font:inherit;border:1px solid var(--line)}
.subject:hover{transform:translateY(-3px)}
.icon{font-size:2rem;margin-bottom:8px}
button{border:0;border-radius:12px;padding:14px 18px;cursor:pointer;font:inherit;font-weight:700;background:var(--btn);color:#fff;margin:12px 8px 0 0;min-height:48px;touch-action:manipulation}
button:hover{background:var(--btnh)}
button:focus-visible,select:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
button.subject{background:var(--card);margin:0;font-weight:400;min-height:0}
button.subject:hover{background:var(--card)}
.secondary{background:var(--sec)}
.hidden{display:none}
.option{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);margin:10px 0 0;font-weight:500}
.option:hover:not(:disabled){background:var(--line)}
.option:disabled{cursor:default}
.option.correct{background:var(--ok);border-color:var(--ok)}
.option.wrong{background:var(--bad);border-color:var(--bad)}
.progress{height:10px;background:var(--bar);border-radius:10px;overflow:hidden;margin:14px 0}
.progress-bar{height:100%;background:var(--fill);width:0;transition:width .3s}
#question{font-size:clamp(1.1rem,4.5vw,1.4rem);line-height:1.35}
.explanation{margin-top:14px;padding:14px;background:var(--card);border-radius:10px;color:var(--exp)}
.score{font-size:clamp(2.4rem,12vw,3.4rem);font-weight:800;text-align:center;margin:16px}
label{display:block;margin-top:12px;font-weight:600}
select{width:100%;padding:14px;border-radius:10px;border:0;margin-top:6px;font-size:1rem;background:var(--field);color:var(--fieldink)}
.center{text-align:center}
@media (max-width:480px){.card{padding:14px}button{width:100%;margin-right:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>🎓 Criminology Quiz Reviewer</h1>
  <p>Study • Practice • Test Your Knowledge</p>
</header>

<div class="container">
  <section id="home">
    <div class="card"><h2>📚 Choose a Subject</h2><p>Select a topic to start reviewing.</p></div>
    <div class="grid" id="subjects"></div>
    <div class="card">
      <h2>⚡ Random Quiz</h2>
      <p>Test yourself using questions from different criminology subjects.</p>
      <label for="randomCount">Number of Questions</label>
      <select id="randomCount">
        <option value="5">5 Questions</option>
        <option value="10" selected>10 Questions</option>
        <option value="20">20 Questions</option>
      </select>
      <button onclick="startRandomQuiz()">Start Random Quiz</button>
    </div>
  </section>

  <section id="settings" class="hidden">
    <div class="card">
      <h2 id="selectedSubject"></h2>
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="all">All Levels</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <label for="questionCount">Number of Questions</label>
      <select id="questionCount">
        <option value="5">5 Questions</option>
        <option value="10" selected>10 Questions</option>
        <option value="20">20 Questions</option>
      </select>
      <button onclick="beginQuiz()">Start Quiz</button>
      <button class="secondary" onclick="goHome()">Back</button>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="card">
      <p id="questionNumber"></p>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <h2 id="question"></h2>
      <div id="options"></div>
      <div id="explanation" class="explanation hidden" aria-live="polite"></div>
      <button id="nextButton" onclick="nextQuestion()" class="hidden">Next Question →</button>
    </div>
  </section>

  <section id="results" class="hidden">
    <div class="card">
      <h2 class="center">🏆 Quiz Complete!</h2>
      <div class="score" id="finalScore"></div>
      <p class="center" id="resultMessage"></p>
      <button onclick="restartQuiz()">Try Again</button>
      <button class="secondary" onclick="goHome()">Back to Subjects</button>
    </div>
  </section>
</div>

const $ = id => document.getElementById(id);
let currentSubject = "", currentQuestions = [], currentQuestion = 0, score = 0, randomMode = false;

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// turn a compact row into a question object with shuffled options
function build(row, subject){
  const options = shuffle(row.slice(1, 5).map((text, i) => ({text, ok: i === 0})));
  return {q: row[0], options, answer: options.findIndex(o => o.ok), difficulty: row[5], explanation: row[6], subject};
}

function showOnly(id){
  ["home","settings","quiz","results"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo(0, 0);
}

// subject cards
Object.keys(quizData).forEach(subject => {
  const d = quizData[subject];
  const b = document.createElement("button");
  b.className = "card subject";
  b.innerHTML = '<div class="icon"></div><h2></h2><p></p>';
  b.querySelector(".icon").textContent = d.icon;
  b.querySelector("h2").textContent = subject;
  b.querySelector("p").textContent = d.questions.length + (d.questions.length === 1 ? " question" : " questions") + " available";
  b.onclick = () => selectSubject(subject);
  $("subjects").appendChild(b);
});

function selectSubject(subject){
  currentSubject = subject;
  randomMode = false;
  $("selectedSubject").textContent = subject;
  showOnly("settings");
}

function startRandomQuiz(){
  randomMode = true;
  currentSubject = "Random Quiz";
  const all = [];
  Object.keys(quizData).forEach(s => quizData[s].questions.forEach(r => all.push(build(r, s))));
  currentQuestions = shuffle(all).slice(0, Number($("randomCount").value));
  startQuizScreen();
}

function beginQuiz(){
  randomMode = false;
  const difficulty = $("difficulty").value;
  let rows = quizData[currentSubject].questions;
  if (difficulty !== "all") rows = rows.filter(r => r[5] === difficulty);
  if (rows.length === 0) { alert("No questions available for this difficulty."); return; }
  const count = Number($("questionCount").value);
  currentQuestions = shuffle(rows.map(r => build(r, currentSubject))).slice(0, count);
  startQuizScreen();
}

function startQuizScreen(){
  currentQuestion = 0;
  score = 0;
  showOnly("quiz");
  showQuestion();
}

function showQuestion(){
  const q = currentQuestions[currentQuestion];
  $("questionNumber").textContent = "Question " + (currentQuestion + 1) + " of " + currentQuestions.length;
  $("question").textContent = q.q;
  $("progressBar").style.width = (currentQuestion / currentQuestions.length * 100) + "%";
  $("options").innerHTML = "";
  $("explanation").classList.add("hidden");
  $("nextButton").classList.add("hidden");
  $("nextButton").textContent = currentQuestion === currentQuestions.length - 1 ? "See Results →" : "Next Question →";
  q.options.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.textContent = o.text;
    b.onclick = () => selectAnswer(i, b);
    $("options").appendChild(b);
  });
}

function selectAnswer(index, btn){
  const q = currentQuestions[currentQuestion];
  const buttons = document.querySelectorAll(".option");
  buttons.forEach(b => b.disabled = true);
  if (index === q.answer) {
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");
    buttons[q.answer].classList.add("correct");
  }
  $("explanation").textContent = "💡 " + q.explanation;
  $("explanation").classList.remove("hidden");
  $("nextButton").classList.remove("hidden");
  $("nextButton").scrollIntoView({behavior: "smooth", block: "nearest"});
}

function nextQuestion(){
  currentQuestion++;
  if (currentQuestion >= currentQuestions.length) showResults(); else showQuestion();
}

function showResults(){
  showOnly("results");
  const pct = Math.round(score / currentQuestions.length * 100);
  $("finalScore").textContent = score + " / " + currentQuestions.length;
  $("resultMessage").textContent =
    pct >= 90 ? "🏆 Excellent! You have a strong understanding of the topic." :
    pct >= 75 ? "👏 Good job! Keep reviewing and improving." :
    pct >= 60 ? "📖 Fair performance. More review will help." :
                "💪 Keep studying. You can improve with practice!";
}

function restartQuiz(){
  if (randomMode) startRandomQuiz(); else beginQuiz();
}

function goHome(){ showOnly("home"); }
</script>
